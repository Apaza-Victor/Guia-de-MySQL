  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var input = document.getElementById('searchInput404');
      if (input) {
        var container = document.createElement('div');
        container.className = 'search-results-header';
        input.parentNode.style.position = 'relative';
        input.parentNode.appendChild(container);

        input.addEventListener('input', function() {
          if (typeof searchIndex === 'undefined') {
            loadSearchIndex(function() { input.dispatchEvent(new Event('input')); });
            return;
          }
          var query = this.value.trim();
          if (query.length < 2) { container.style.display = 'none'; return; }
          var results = searchInIndex(query);
          if (results.length === 0) {
            container.innerHTML = '<div class="no-results">Sin resultados</div>';
            container.style.display = 'block';
            return;
          }
          container.innerHTML = results.map(function(r) {
            return '<a href="' + r.url + '"><div style="font-weight:600;">' + highlightText(r.title, query) + '</div>' +
              (r.description ? '<div style="font-size:0.75rem;color:var(--text-muted);">' + highlightText(r.description, query) + '</div>' : '') + '</a>';
          }).join('');
          container.style.display = 'block';
        });

        function loadSearchIndex(cb) {
          fetch('assets/search-index.json').then(function(r) { return r.json(); }).then(function(data) {
            window.searchIndex = data;
            if (cb) cb();
          });
        }

        function searchInIndex(q) {
          q = q.toLowerCase();
          return (window.searchIndex || []).filter(function(p) {
            return (p.title + ' ' + p.h1 + ' ' + p.description + ' ' + (p.headings||[]).join(' ') + ' ' + (p.text||'')).toLowerCase().indexOf(q) !== -1;
          }).slice(0, 8).map(function(p) { return { url: p.url, title: p.title, description: p.description }; });
        }

        function highlightText(text, query) {
          var r = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          return text.replace(new RegExp('(' + r + ')', 'gi'), '<span style="background:var(--accent-light);color:var(--accent);font-weight:700;">$1</span>');
        }

        document.addEventListener('click', function(e) {
          if (!e.target.closest('.search-box')) container.style.display = 'none';
        });
      }
    });
  </script>
